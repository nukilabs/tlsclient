name: trust anchors

# The Chrome Root Store ships through Chrome's component updater, so the trust anchor set the
# trust_anchors extension advertises moves independently of Chrome releases. This checks weekly
# and opens a PR when it drifts.
#
# The PR is deliberately not auto-merged: root_store.textproto on Chromium main is the source
# that later becomes a component, so it leads what real installs advertise by days to weeks.
# Land the PR once the component has actually rolled out, not the moment upstream changes.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate the trust anchor table
        run: go run ./tools/trustanchors

      - name: Open a pull request if the set changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- profiles/trustanchors.go; then
            echo "Trust anchor set is unchanged."
            exit 0
          fi

          version=$(sed -n 's/.*version_major \([0-9]\{1,\}\)).*/\1/p' profiles/trustanchors.go | head -1)
          count=$(grep -c '^\s*{0x' profiles/trustanchors.go)
          branch="trust-anchors/v${version}"

          echo "Root store moved to version_major ${version} with ${count} anchors."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add profiles/trustanchors.go
          git commit -m "chore: refresh Chrome Root Store trust anchors (version_major ${version})"
          git push --force-with-lease origin "${branch}"

          if [ -n "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]; then
            echo "PR for ${branch} already open, pushed an update to it."
            exit 0
          fi

          gh pr create \
            --head "${branch}" \
            --title "chore: refresh Chrome Root Store trust anchors (version_major ${version})" \
            --body "Regenerated by \`tools/trustanchors\` from Chromium main.

          Root store is now \`version_major ${version}\`, advertising ${count} trust anchors.

          Chromium main is the source that *becomes* a component, so it leads what real Chrome
          installs advertise by days to weeks. Hold this until the component has rolled out —
          \`chrome://components\` on a real install shows its PKI Metadata version, and
          \`PKIMetadata/<version>/crs.pb\` under the Chrome user data directory holds the set
          that is actually shipping."
